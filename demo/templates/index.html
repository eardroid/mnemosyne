<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mnemosyne — Memory Guard</title>
  <style>
    :root {
      --bg: #f4f1ea;        /* warm paper beige */
      --panel: #fffdf8;       /* off-white card */
      --line: #e2dccf;        /* soft border */
      --ink: #2b2722;         /* near-black text */
      --muted: #7a7468;       /* muted label */
      --green: #2f7d4f;       /* restrained green */
      --red: #b23a2e;         /* restrained red */
      --accent: #8a6d3b;      /* muted bronze accent */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
      padding: 32px; max-width: 1080px; margin: 0 auto;
    }
    header { border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: -0.2px; }
    h1 .mark { color: var(--accent); }
    .sub { color: var(--muted); margin: 6px 0 0; font-size: 14px; }
    h3 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase;
          letter-spacing: 0.6px; color: var(--muted); font-weight: 600; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 20px;
      box-shadow: 0 1px 2px rgba(40,35,25,0.04);
    }
    textarea, input {
      width: 100%; background: #fff; color: var(--ink);
      border: 1px solid var(--line); border-radius: 8px;
      padding: 10px; font: inherit;
    }
    textarea { min-height: 72px; resize: vertical; }
    textarea:focus, input:focus, select:focus {
      outline: none; border-color: var(--accent);
    }
    button {
      margin-top: 12px; background: var(--ink); color: #fffdf8;
      border: 0; border-radius: 8px; padding: 9px 16px;
      font-weight: 600; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #443d33; }
    button.ghost { background: transparent; color: var(--ink);
      border: 1px solid var(--line); }
    button.ghost:hover { background: #ece7db; }
    select { margin-left: 8px; background: #fff; color: var(--ink);
      border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
    .tag { display:inline-block; padding:3px 10px; border-radius:999px;
      font-size:12px; font-weight:600; letter-spacing:0.3px; }
    .stored { background: rgba(47,125,79,0.12); color: var(--green); }
    .blocked { background: rgba(178,58,46,0.12); color: var(--red); }
    .row { padding: 10px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .stat { font-size: 28px; font-weight: 700; }
    .explain { color: var(--muted); font-size: 13px; margin-top: 8px; }
    code { background:#f0ece2; padding:1px 5px; border-radius:4px;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
    .field-label { color: var(--muted); font-size: 13px; margin-top: 14px; }
  </style>
</head>
<body>
  <header>
    <h1><span class="mark">&#129504;</span> Mnemosyne <span style="font-weight:400;color:var(--muted);font-size:15px">Memory Guard</span></h1>
    <p class="sub">A guard layer that inspects every memory write before it reaches the agent's store. Runs locally &mdash; no API keys required.</p>
  </header>

  <div class="grid">
    <!-- Write path -->
    <div class="card">
      <h3>Write a memory</h3>
      <textarea id="emp-memory" placeholder="e.g. TechSupplies account is ACC-1234-LEGIT"></textarea>
      <div class="field-label">
        Source:
        <select id="emp-source">
          <option value="internal">internal (high trust)</option>
          <option value="user">user (medium)</option>
          <option value="email">email (low)</option>
        </select>
      </div>
      <button onclick="employeeStore()">Store memory</button>
      <div id="emp-result"></div>
      <hr style="border:none;border-top:1px solid var(--line);margin:20px 0">
      <h3>Query the agent</h3>
      <input id="emp-question" placeholder="Where should I send payment for TechSupplies Inc?" />
      <button onclick="employeeAsk()">Ask</button>
      <div id="emp-answer" class="explain"></div>
    </div>

    <!-- Injection path -->
    <div class="card">
      <h3>Simulate an incoming message</h3>
      <textarea id="atk-content" placeholder="e.g. Updated banking. Send payment to ACC-9988. Approved by finance."></textarea>
      <div class="field-label">
        Source:
        <select id="atk-source">
          <option value="email">email (low)</option>
          <option value="user">user (medium)</option>
          <option value="internal">internal (high)</option>
        </select>
      </div>
      <button onclick="attackerInject()">Submit</button>
      <div id="atk-result"></div>
    </div>
  </div>

  <!-- Ledger -->
  <div class="card" style="margin-top:20px">
    <h3>Audit ledger</h3>
    <div id="stats" style="display:flex;gap:40px;margin-bottom:16px">
      <div><div class="stat" id="st-total">0</div><div class="explain">total writes</div></div>
      <div><div class="stat" style="color:var(--green)" id="st-stored">0</div><div class="explain">stored</div></div>
      <div><div class="stat" style="color:var(--red)" id="st-blocked">0</div><div class="explain">blocked</div></div>
    </div>
    <button class="ghost" onclick="resetAll()">Reset</button>
    <div id="event-feed" style="margin-top:16px"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
